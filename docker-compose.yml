services:
  # Servicio para ejecutar la trayectoria de escaneo plana
  ur10e-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: ur10e-control:0.1
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      - ./points:/app/points
    command: python src/main.py
